<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dictation</title>
<style>
:root{color-scheme:dark;--accent:#a9e879}*{box-sizing:border-box}body{margin:0;background:#060709;color:#f8f8f2;font:clamp(15px,3.7vh,20px) system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(780px,96vw);padding:12px;display:flex;flex-direction:column;gap:clamp(8px,2.6vh,16px)}h1{font-size:clamp(18px,4.3vh,23px);margin:0;font-weight:600}.row{display:flex;gap:8px;align-items:center}.row label{min-width:82px;color:#c0c8ce}button,select{font:inherit;border:1px solid #64717a;border-radius:7px;padding:7px 10px;background:#151a1f;color:inherit}button{cursor:pointer;white-space:nowrap}button[aria-pressed=true]{background:var(--accent);color:var(--ink,#060709);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}select{min-width:0;flex:1}button:disabled{opacity:.5;cursor:wait}p{margin:0;line-height:1.3;color:#c0c8ce}#status{color:var(--accent);min-height:1.3em}#note,.hint{font-size:clamp(13px,3.2vh,17px)}#note{min-height:1.3em}.hint{border-top:1px solid #53616b;padding-top:10px}
</style><main><h1>Dictation</h1><div class="row"><label>Language</label><button data-lang="en" aria-pressed="false">E · English</button><button data-lang="ro" aria-pressed="false">R · Română</button></div><div class="row"><label for="model">Model</label><select id="model" aria-label="Whisper model"></select><button id="use">S · Use</button></div><p id="note"></p><p id="status" role="status">Loading…</p><p class="hint">Hold gamepad A to speak; release to type.<br>M: model · arrows: choose · S: use · Right Alt + Q: close</p></main>
<script>
const buttons=[...document.querySelectorAll('[data-lang]')],status=document.querySelector('#status'),model=document.querySelector('#model'),use=document.querySelector('#use'),note=document.querySelector('#note');let state=null,busy=false,notice='';
function detail(){if(!state)return;const m=state.models.find(m=>m.name===model.value);if(!m)return;const speed=m.name.startsWith('tiny')?'Fastest; lower accuracy.':m.name.startsWith('base')?'Balanced for the CM5.':m.name.startsWith('small')?'More accuracy; slower.':'Heavy on the CM5; slower transcription.';note.textContent=(m.english_only?'English only. ': 'English + Romanian. ')+speed;use.textContent=m.name===state.active_model?'Active':m.installed?'S · Use':'S · Download';use.disabled=busy||['downloading','loading'].includes(state.job.phase)||m.name===state.active_model||(state.language==='ro'&&m.english_only);}
function show(data){state=data;const previous=model.value;for(const b of buttons){b.setAttribute('aria-pressed',String(b.dataset.lang===data.language));b.disabled=['downloading','loading'].includes(data.job.phase);}const signature=JSON.stringify([data.language,data.models]);if(model.dataset.signature!==signature){model.replaceChildren();for(const m of data.models){const o=document.createElement('option');o.value=m.name;o.textContent=m.name+(m.installed?' · installed':'')+(m.english_only?' · EN':'');o.disabled=data.language==='ro'&&m.english_only;model.append(o);}model.dataset.signature=signature;model.value=data.models.some(m=>m.name===previous&&!(data.language==='ro'&&m.english_only))?previous:data.active_model;}const j=data.job;status.textContent=j.phase==='error'?'Could not switch: '+j.error:j.phase==='downloading'?'Downloading '+j.target+'… Current: '+data.active_model:j.phase==='loading'?'Loading '+j.target+'… Current: '+data.active_model:notice||('Active: '+data.active_model+' · '+(data.language==='ro'?'Română':'English'));detail();}
async function refresh(){try{const r=await fetch('/api/dictation'),d=await r.json();if(!r.ok)throw Error(d.error);show(d);}catch(e){status.textContent=e.message;}}
async function update(data){if(busy)return;busy=true;notice='';try{const r=await fetch('/api/dictation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);show(d);}catch(e){notice=e.message;status.textContent=notice;}finally{busy=false;detail();}}
buttons.forEach(b=>b.onclick=()=>update({language:b.dataset.lang}));model.onchange=()=>{notice='';detail();};use.onclick=()=>update({model:model.value});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const k=e.key.toLowerCase();if(k==='m'){e.preventDefault();model.focus();}else if(k==='s'){e.preventDefault();if(!use.disabled)use.click();}else if(['1','e','2','r'].includes(k)&&e.target!==model){e.preventDefault();const b=buttons[['1','e'].includes(k)?0:1];b.focus();if(!b.disabled)b.click();}});
fetch('/api/state').then(r=>r.json()).then(d=>{document.documentElement.style.setProperty('--accent',d.accent);document.documentElement.style.setProperty('--ink',d.ink);}).catch(()=>{});
refresh().then(()=>buttons.find(b=>b.getAttribute('aria-pressed')==='true')?.focus());setInterval(()=>{if(!busy)refresh();},1500);
</script></html>
