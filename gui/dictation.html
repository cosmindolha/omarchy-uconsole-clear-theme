<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dictation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060709;color:#f8f8f2;font:22px system-ui,sans-serif;height:100vh;display:grid;place-items:center}main{width:min(780px,94vw);padding:20px}h1{font-size:25px;margin:0 0 24px}p{color:#c0c8ce;line-height:1.5}.choices{display:flex;gap:18px}button{flex:1;font:inherit;font-weight:650;text-align:left;border:2px solid #53616b;border-radius:10px;padding:24px;background:#151a1f;color:inherit}button[aria-pressed=true]{border-color:var(--accent,#a9e879);background:#1b2820}button:focus-visible{outline:3px solid #f8f8f2;outline-offset:4px}small{display:block;margin-top:10px;font-size:18px;color:#c0c8ce}#status{min-height:34px;color:var(--accent,#a9e879);margin-top:25px}.hint{font-size:19px;margin-top:28px}kbd{font:inherit;color:#f8f8f2}

body{font-size:clamp(16px,4vh,22px)}main{padding:12px;display:flex;flex-direction:column;gap:clamp(6px,2vh,14px)}h1{font-size:clamp(19px,4.5vh,25px);margin:0}p{margin:0;line-height:1.3}button{padding:clamp(10px,3vh,24px)}small{font-size:clamp(14px,3.3vh,18px);margin-top:6px}#status{min-height:0;margin:0}.hint{font-size:clamp(14px,3.4vh,18px);margin:0}
</style><main><h1>Dictation language</h1><div class="choices"><button data-lang="en" aria-pressed="false">English<small>1 or E</small></button><button data-lang="ro" aria-pressed="false">Română<small>2 or R</small></button></div><p id="status" role="status">Loading…</p><p>Hold gamepad A to speak; release to type.</p><p class="hint">Saved instantly · No language detection.<br><kbd>← →</kbd> choose · <kbd>Enter</kbd> save · <kbd>Right Alt + Q</kbd> close</p></main>
<script>
const buttons=[...document.querySelectorAll('button')],status=document.querySelector('#status');let busy=false;
function show(data){for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.lang===data.language));status.textContent=(data.language==='ro'?'Română':'English')+' · Saved';}
async function choose(language){if(busy)return;busy=true;status.textContent='Saving…';try{const r=await fetch('/api/dictation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language})});const d=await r.json();if(!r.ok)throw Error(d.error);show(d);}catch(e){status.textContent=e.message;}finally{busy=false;}}
buttons.forEach(b=>b.onclick=()=>choose(b.dataset.lang));
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const k=e.key.toLowerCase();if(['1','e','2','r'].includes(k)){e.preventDefault();const n=['1','e'].includes(k)?0:1;buttons[n].focus();choose(buttons[n].dataset.lang);}else if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();buttons[e.key==='ArrowLeft'?0:1].focus();}});
fetch('/api/state').then(r=>r.json()).then(d=>document.documentElement.style.setProperty('--accent',d.accent)).catch(()=>{});
fetch('/api/dictation').then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);show(d);buttons.find(b=>b.dataset.lang===d.language).focus();}).catch(e=>status.textContent=e.message);
</script></html>
