<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice launcher</title><style>
:root{color-scheme:dark;--accent:#a9e879;--ink:#060709}*{box-sizing:border-box}body{margin:0;background:#060709;color:#f8f8f2;font:clamp(15px,3.8vh,20px) system-ui,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}main{width:min(800px,96vw);padding:14px;display:flex;flex-direction:column;gap:10px;max-height:96vh}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font:inherit;font-weight:600;margin:0}#status{color:var(--accent)}input,button{font:inherit;color:inherit;background:#151a1f;border:1px solid #64717a;border-radius:7px;padding:8px 10px}input{width:100%;outline:none}input:focus{border-color:var(--accent)}#results{overflow:auto;min-height:45px}button{display:block;width:100%;margin:5px 0;text-align:left;cursor:pointer}button.selected{background:var(--accent);color:var(--ink)}p{margin:0;color:#c0c8ce;font-size:.9em}.hint{border-top:1px solid #53616b;padding-top:8px}</style><main><header><h1>Voice launcher</h1><span id="status">Ready</span></header><input id="query" aria-label="Find an app" placeholder="Say an app name, or type…" autocomplete="off"><div id="results"></div><p class="hint">Hold B: speak · ↑ ↓: choose · Enter: launch · Esc: cancel</p></main><script>
const q=document.querySelector('#query'),status=document.querySelector('#status'),list=document.querySelector('#results');let current={},selected=0,timer,busy=false,editing=false,signature='';
async function post(data){const r=await fetch('/api/launcher',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
function draw(s){current=s;const recording=['recording','transcribing'].includes(s.phase);q.readOnly=recording;status.textContent=({idle:'Hold B to speak',recording:'Listening…',transcribing:'Decoding…',results:!s.text?'No speech heard':s.automatic?'Opening…':'Choose an app',opening:'Opening…',launched:'Opened',error:'Try again'})[s.phase]||'';if(!editing)q.value=s.text||'';const sig=JSON.stringify([s.phase,s.matches,s.error]);if(sig!==signature){signature=sig;selected=0;list.replaceChildren();for(const [i,a]of(s.matches||[]).entries()){const b=document.createElement('button');b.textContent=a.name;b.onclick=()=>launch(a.id);b.dataset.index=i;list.append(b);}if(!s.matches?.length){const p=document.createElement('p');p.textContent=s.error||(s.phase==='results'?'No app found. Edit the words or hold B to try again.':'Only installed apps are launched.');list.append(p);}highlight();}}
function highlight(){list.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('selected',i===selected));list.querySelector('.selected')?.scrollIntoView({block:'nearest'});}
async function launch(id){if(busy)return;busy=true;try{draw(await post({action:'launch',id}));}catch(e){status.textContent=e.message;}finally{busy=false;}}
q.oninput=async()=>{editing=true;clearTimeout(timer);if(current.automatic){current.automatic=null;await post({action:'cancel'});}clearTimeout(timer);timer=setTimeout(async()=>{try{draw(await post({action:'search',text:q.value}));editing=false;}catch(e){status.textContent=e.message;}},220);};
document.addEventListener('keydown',async e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const n=current.matches?.length||0;if(n){selected=(selected+(e.key==='ArrowDown'?1:n-1))%n;highlight();}}else if(e.key==='Enter'&&current.matches?.[selected]){e.preventDefault();launch(current.matches[selected].id);}else if(e.key==='Escape'){e.preventDefault();editing=false;clearTimeout(timer);draw(await post({action:'cancel'}));q.focus();}});
async function refresh(){try{const r=await fetch('/api/launcher');if(r.ok)draw(await r.json());}catch(e){status.textContent='Launcher unavailable';}}
fetch('/api/state').then(r=>r.json()).then(d=>{document.documentElement.style.setProperty('--accent',d.accent);document.documentElement.style.setProperty('--ink',d.ink);}).catch(()=>{});refresh();q.focus();setInterval(refresh,250);
window.addEventListener('pagehide',()=>navigator.sendBeacon('/api/launcher',new Blob([JSON.stringify({action:'cancel'})],{type:'application/json'})));
</script></html>
